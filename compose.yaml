services:
  api:
    build: .
    image: parakeet-diarise:api
    gpus: all
    env_file:
      - .env
    environment:
      API_PORT: "${API_PORT:-8000}"
      ASR_BACKEND: "${ASR_BACKEND:-nemo}"
      ASR_MODEL: "${ASR_MODEL:-parakeet-1.1b}"
      DIARIZATION_MODEL: "${DIARIZATION_MODEL:-nvidia/Nemotron-3-Diarization}"
    volumes:
      - ./Output/.cache:/app/.cache
    working_dir: /app
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
